<!DOCTYPE html>
<html lang="de">
    <head>
        <!-- Meta -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Titel -->
        <title>Main</title>

        <!-- CSS -->
        <link rel="stylesheet" href="css/mascot.css">
        <link rel="stylesheet" href="css/footer.css">
        <link rel="stylesheet" href="css/header.css">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/body.css">
        <link rel="stylesheet" href="css/assignment-boxes.css">
        <style>
            .fach {
                position: relative;
                display: block;
            }

            /* Styling der Buttons und Aufgaben wie in der Sidebar */
            .fach-content {
                display: block;
                position: relative;
                background-color: #e7e7ec; /* Gleicher Hintergrund wie die Sidebar */
                border-radius: 5px; /* Abgerundete Ecken */
                padding: 10px;
                margin-top: 10px;
                margin-bottom: 20px;
                box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            }

            .fach button {
                box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            }

            .fach-content a {
                color: black;
                padding: 12px 16px;
                text-decoration: none;
                display: block;
                border-bottom: 1px solid #ddd; /* Trennlinien zwischen den Links */
            }

            .fach-content a:hover {
                background-color: #ddd; /* Hover-Effekt wie in der Sidebar */
            }

            .full-width-button {
                width: 100%;
                text-align: left;
                padding-left: 10px;
                background: #4CAF50; /* Hintergrundfarbe des Buttons */
                color: white; /* Textfarbe des Buttons */
                border: none;
                padding: 10px;
                border-radius: 5px; /* Abgerundete Ecken */
                cursor: pointer;
                font-size: 16px;
            }

            .full-width-button:hover {
                background: #45a049; /* Hover-Effekt für den Button */
            }

            .fach-content a:last-child {
                border-bottom: none; /* Entfernt die untere Trennlinie des letzten Links */
            }
        </style>
    </head>
    <body onload="initializeText()">
        <!-- Header Leiste -->
        <header>
            <!-- Flexbox für das Logo und den Text -->
            <div style="display: flex; align-items: center;">
                <!-- Logo mit Link -->
                <a href="#" onclick="redirectToMainPage()">
                    <img src="textures/logo-header.png" alt="Logo">
                </a>

                <!-- Titel/Navigation -->
                <h1>Main</h1> <!-- Change this text -->
            </div>

            <!-- Logout Button -->
            <button class="logout-button" onclick="logout()">Logout</button> <!-- Change this text -->
        </header>

        <!-- Main Teil der Seite -->
        <main>
            <!-- Fächer ohne Dropdowns -->
            <div class="field">
                <!-- Dynamische Fächer und Aufgaben werden hier hinzugefügt -->
            </div>
        
            <!-- Großes Maskottchen rechts -->
            <div class="mascot-container">
                <div class="speech-bubble" id="speech-bubble">
                    <p id="speech-text">Wähle das Assignment aus ,dass du bearbeiten willst :></p> <!-- Change this text -->
                </div>
                <img src="textures/battery1.png" alt="Mascot"> <!-- Change the image source if needed -->
            </div>
        </main>
        
        <!-- Fußleiste -->
        <footer>
            <!-- Text im Footer -->
            <p id="userInfo">Sie sind angemeldet als <span id="username"></span> (<span id="role"></span>)</p> <!-- Change this text -->
        </footer>

        <!-- Scripts -->
        <script src="js/logout.js"></script>
        <script src="js/redirectToMainPage.js"></script>
        <script src="js/loadLoginData.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Die Daten für Fächer und Aufgaben
                const data = {
                    "subjects": [
                        {
                            "name": "Programmieren_I", 
                            "assignments": [
                                {"name": "Assignment_01", "image": "textures/lädt.png"},
                                {"name": "Assignment_02", "image": "textures/voll.png"},
                                {"name": "Assignment_03", "image": "textures/voll.png"},
                                {"name": "Assignment_04", "image": "textures/voll.png"},
                                {"name": "Assignment_06", "image": "textures/lehr.png"},
                                {"name": "Assignment_05", "image": "textures/lehr.png"}
                            ]
                        },
                        {
                            "name": "Datenstrukturen_und_Algorithmen", 
                            "assignments": [
                                {"name": "Assignment_01", "image": "textures/lädt.png"},
                                {"name": "Assignment_02", "image": "textures/voll.png"},
                                {"name": "Assignment_03", "image": "textures/voll.png"},
                            ]
                        }
                    ]
                };

                function initializeText() {
                    document.getElementById('speech-text').textContent = "Das sind deine Fächer. Klick sie an";
                }

                // Funktion, um die Fächer und Aufgaben in die HTML-Struktur zu laden
                function loadSubjects() {
                    const fachContainer = document.querySelector('.field'); // field auswählen
                    const userSubjects = sessionStorage.getItem("subjects");

                    data.subjects.forEach((subject) => {
                        // Zeige nur die Fächer an, die ein Student auch wirklich hat
                        if (!userSubjects.includes(subject.name)) {
                            return;
                        }

                        // Erstelle den Fach-Div
                        const fachDiv = document.createElement('div');
                        fachDiv.classList.add('fach');
                        
                        // Button für das Fach
                        const fachButton = document.createElement('button');
                        fachButton.classList.add('full-width-button');
                        fachButton.textContent = subject.name.replaceAll('_', ' '); // Change this text if needed
                        
                        // Erstelle die Fach-Inhalte
                        const fachContentDiv = document.createElement('div');
                        fachContentDiv.classList.add('fach-content');
                        
                        // Füge die Assignments hinzu
                        subject.assignments.forEach(assignment => {
                            const assignmentDiv = document.createElement('div');
                            assignmentDiv.style.display = 'flex';
                            assignmentDiv.style.alignItems = 'center';
                            assignmentDiv.style.justifyContent = 'space-between'; // Align items to the right

                            const assignmentLink = document.createElement('a');
                            assignmentLink.href = 'assignment-student.html?subject=' + subject.name + '&assignment=' + assignment.name;
                            assignmentLink.textContent = assignment.name.replaceAll('_', ' ');
                            assignmentLink.style.flexGrow = '1'; // Extend the link to fill available width

                            const assignmentImage = document.createElement('img');
                            assignmentImage.src = assignment.image;
                            assignmentImage.alt = 'Assignment Bild';
                            assignmentImage.style.marginLeft = '10px';
                            assignmentImage.style.width = '50px'; // Adjust the size as needed
                            assignmentImage.style.height = '50px'; // Adjust the size as needed

                            assignmentDiv.appendChild(assignmentLink);
                            assignmentDiv.appendChild(assignmentImage);
                            fachContentDiv.appendChild(assignmentDiv);
                        });
                        
                        // Füge den Button und den Inhalt zum Fach-Div hinzu
                        fachDiv.appendChild(fachButton);
                        fachDiv.appendChild(fachContentDiv);
                        
                        // Füge das Fach-Div zum field hinzu
                        fachContainer.appendChild(fachDiv);
                    });
                }

                // Initialisiere die Fächer beim Laden der Seite
                loadSubjects();
            });
        </script>
    </body>
</html>
